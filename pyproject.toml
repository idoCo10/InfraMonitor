[project]
name = "inframonitor"
version = "0.1.11"
description = "Infrastructure monitoring and security visibility tool"
requires-python = ">=3.11"

dependencies = [
    "psutil",
]

[project.scripts]
inframonitor = "inframonitor_agent.main:main"

[project.optional-dependencies]
backend = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",   
    "alembic", 
    "jinja2",    
]

dev = [
    "pytest",
    "ruff",
    "httpx",
]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "agent",
    "backend",
]
[project]
name = "inframonitor"
version = "0.1.0"
description = "Infrastructure monitoring and security visibility tool"
requires-python = ">=3.11"

dependencies = [
    "psutil",
    "pytest"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
name: CI/CD

on:
  #pull_request:
  #  branches:
  #    - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ---------------------------------------------------------
  # TEST
  # ---------------------------------------------------------

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: inframonitor_test
          POSTGRES_USER: inframonitor
          POSTGRES_PASSWORD: inframonitor

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U inframonitor -d inframonitor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[backend,dev]"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://inframonitor:inframonitor@127.0.0.1:5432/inframonitor_test
        run: alembic upgrade head

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://inframonitor:inframonitor@127.0.0.1:5432/inframonitor_test
        run: python -m pytest


  # ---------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------

  build:
    name: Build ${{ matrix.name }} Docker image
    runs-on: ubuntu-latest

    needs:
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - name: agent
            dockerfile: ./agent/Dockerfile
            image: inframonitor-agent

          - name: backend
            dockerfile: ./backend/Dockerfile
            image: inframonitor-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}


  # ---------------------------------------------------------
  # PUBLISH
  # Runs only after code is merged/pushed to main
  # ---------------------------------------------------------

  publish:
    name: Publish ${{ matrix.name }} Docker image
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - name: agent
            dockerfile: ./agent/Dockerfile
            image: inframonitor-agent

          - name: backend
            dockerfile: ./backend/Dockerfile
            image: inframonitor-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          BUILD_TIME=$(TZ=Asia/Bangkok date '+%d/%m/%y %H:%M:%S')

          echo "INFRAMONITOR_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "INFRAMONITOR_BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            INFRAMONITOR_VERSION=${{ env.INFRAMONITOR_VERSION }}
            INFRAMONITOR_BUILD_TIME=${{ env.INFRAMONITOR_BUILD_TIME }}          
          tags: |
            ghcr.io/idoco10/${{ matrix.image }}:latest
            ghcr.io/idoco10/${{ matrix.image }}:${{ github.sha }}


  # ---------------------------------------------------------
  # DEPLOY
  # Runs only after images are published to main
  # ---------------------------------------------------------

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    needs:
      - publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy InfraMonitor
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            cd ~/inframonitor

            curl -fsSL https://raw.githubusercontent.com/idoCo10/InfraMonitor/main/deploy/server/compose.yaml -o compose.yaml

            sudo docker compose pull
            sudo docker compose up -d

            sudo docker compose ps
          EOF

      - name: Verify deployment
        run: |
          curl --fail --retry 10 --retry-delay 5 https://api.icedev.site/health            
name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ---------------------------------------------------------
  # TEST
  # ---------------------------------------------------------

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: inframonitor_test
          POSTGRES_USER: inframonitor
          POSTGRES_PASSWORD: inframonitor

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U inframonitor -d inframonitor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[backend,dev]"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://inframonitor:inframonitor@127.0.0.1:5432/inframonitor_test
        run: alembic upgrade head

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://inframonitor:inframonitor@127.0.0.1:5432/inframonitor_test
        run: python -m pytest


  # ---------------------------------------------------------
  # BUILD
  # ---------------------------------------------------------

  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: inframonitor:${{ github.sha }}


  # ---------------------------------------------------------
  # PUBLISH
  # Runs only after code is merged/pushed to main
  # ---------------------------------------------------------

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inframonitor:latest
            ghcr.io/${{ github.repository_owner }}/inframonitor:${{ github.sha }}
services:
  inframonitor:
    image: ghcr.io/idoco10/inframonitor-agent:${IMAGE_TAG}
    container_name: inframonitor-agent
    network_mode: host
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      INFRAMONITOR_HOST_ROOT: /host
      INFRAMONITOR_BACKEND_URL: ${INFRAMONITOR_BACKEND_URL}
      INFRAMONITOR_INTERVAL: ${INFRAMONITOR_INTERVAL}

    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro


  postgres:
    image: postgres:16
    container_name: inframonitor-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    image: ghcr.io/idoco10/inframonitor-backend:${IMAGE_TAG}
    container_name: inframonitor-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:

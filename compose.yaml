services:

  inframonitor:
    build: .
    image: inframonitor:latest
    network_mode: host
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      INFRAMONITOR_HOST_ROOT: /host
      INFRAMONITOR_BACKEND_URL: http://127.0.0.1:8000
      INFRAMONITOR_INTERVAL: 5

    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro

  postgres:
    image: postgres:16
    container_name: inframonitor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: inframonitor
      POSTGRES_USER: inframonitor
      POSTGRES_PASSWORD: inframonitor

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U inframonitor -d inframonitor
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    image: inframonitor-backend:latest
    container_name: inframonitor-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://inframonitor:inframonitor@postgres:5432/inframonitor

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: